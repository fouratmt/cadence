name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
        if: matrix.browser == 'chromium'
      - name: Install Chromium headless shell
        if: matrix.browser == 'chromium'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        run: npx playwright install --with-deps firefox
      - run: npm run test:browser -- --project="${{ matrix.browser }}" --reporter=dot
        if: matrix.browser != 'webkit'
      - name: Pull the Playwright image for WebKit
        if: matrix.browser == 'webkit'
        id: webkit-image
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          image="mcr.microsoft.com/playwright:v${version}-resolute"
          docker pull "$image"
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Test WebKit
        if: matrix.browser == 'webkit'
        env:
          PLAYWRIGHT_IMAGE: ${{ steps.webkit-image.outputs.ref }}
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --env CI=true --env HOME=/tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace "$PLAYWRIGHT_IMAGE" \
            npm run test:browser -- --project=webkit --reporter=dot
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Stage static site
        run: |
          site_dir="$RUNNER_TEMP/pages"
          mkdir -p "$site_dir"
          cp -R index.html styles.css app.mjs timer.mjs cues.mjs pwa.mjs version.js sw.js manifest.webmanifest assets "$site_dir/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
